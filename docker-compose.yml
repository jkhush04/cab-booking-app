services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cabbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cabbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./cab-booking-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/cabbooking
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./cab-booking-frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_STRIPE_PK: ${VITE_STRIPE_PK}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: